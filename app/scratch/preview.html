<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      padding: 30px;
      background: #0B0F19; /* Noche de Sintético */
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
      font-family: sans-serif;
    }
    .preview-card {
      background: #141B2D;
      border: 1px solid #1F2937;
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 450px;
    }
    .light-card {
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 450px;
    }
    img {
      display: block;
      max-height: 90px;
      width: auto;
    }
    p {
      margin: 0 0 12px 0;
      font-size: 13px;
      color: #94A3B8;
      font-weight: 600;
    }
    .light-card p {
      color: #64748B;
    }
  </style>
</head>
<body>
  <div class="preview-card">
    <p>ORIGINAL LOGO (Backup):</p>
    <img src="../public/logo.original.backup.svg" alt="Original" />
  </div>
  <div class="preview-card">
    <p>NUEVO INTEGRADO: FULBEAND + Pelota en llamas + Palos + Trama de puntos:</p>
    <img src="test_integrated_logo.svg" alt="Nuevo Integrado" />
  </div>
</body>
</html>
