<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 85" width="320" height="85" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:ital,wght@1,900&amp;family=Inter:wght@800&amp;display=swap');
      .brand-title {
        font-family: 'Outfit', 'Montserrat', 'Impact', system-ui, -apple-system, sans-serif;
        font-weight: 900;
        font-style: italic;
        text-transform: uppercase;
        letter-spacing: -0.5px;
        fill: #FFFFFF;
      }
      .brand-subtitle {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        letter-spacing: 4px;
        text-transform: uppercase;
        fill: #22C55E;
      }
    </style>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Grupo centrado del logo -->
  <g filter="url(#glow)">
    <!-- Texto Principal: FULBEAND -->
    <text x="160" y="50" class="brand-title" font-size="44" text-anchor="middle">FULBEAND</text>
    
    <!-- Subtítulo: EL POTRERO DIGITAL -->
    <text x="160" y="72" class="brand-subtitle" font-size="9.5" text-anchor="middle">EL POTRERO DIGITAL</text>
  </g>
</svg>
